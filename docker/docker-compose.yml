# docker/docker-compose.yml
services:
  yolo-vision:
    shm_size: "8gb"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    
    volumes:
      - ..:/app:cached
    
    command: sleep infinity

    environment:
      - DISPLAY=host.docker.internal:0.0
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]